name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser for Windows navigation regression
        run: npx playwright install --with-deps chromium
      - name: Check Windows caption spacing
        run: node scripts/test-window-chrome-visual.cjs

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Exercise installer in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/install.test.ps1
