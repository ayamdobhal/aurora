name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

concurrency:
  group: aurora-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install build tools
        run: npm ci

      - name: Build extensions
        run: npm test && npm run build

      - name: Test Windows installer logic
        shell: pwsh
        run: ./tests/install.test.ps1

      - name: Package
        run: |
          mkdir -p dist
          printf '%s\n' "$GITHUB_SHA" > BUILD.txt
          tar -czf dist/aurora.tar.gz theme extensions BUILD.txt
          zip -r dist/aurora.zip theme extensions BUILD.txt

      - name: Extract changelog section
        id: changelog
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          # Pull lines between "## <tag>" and the next "## v" heading.
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "( |$)" { flag=1; next }
            /^## v/ && flag { exit }
            flag
          ' CHANGELOG.md > dist/notes.md || true
          if [ -s dist/notes.md ]; then
            echo "Found CHANGELOG section for $TAG"
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG section for $TAG — falling back to auto-generated notes"
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release (curated notes)
        if: steps.changelog.outputs.have_notes == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.sha) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/aurora.tar.gz
            dist/aurora.zip
          body_path: dist/notes.md

      - name: Release (auto-generated notes)
        if: steps.changelog.outputs.have_notes == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.sha) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/aurora.tar.gz
            dist/aurora.zip
          generate_release_notes: true
